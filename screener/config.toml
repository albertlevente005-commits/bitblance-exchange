# Kripto projekt-szűrő konfiguráció.
# A titkok (Telegram token, API kulcsok) a .env fájlba mennek, nem ide.

[general]
db_path = "screener.db"
out_dir = "out"
# Kérések közti minimális szünet másodpercben (API-kímélés)
defillama_min_interval = 0.25
coingecko_min_interval = 2.5
github_min_interval = 0.5

[universe]
# Mely DefiLlama-protokollok kerüljenek a figyelt körbe.
min_tvl_usd = 2_000_000
top_n_by_tvl = 300
# Ezeket a DefiLlama-kategóriákat kihagyjuk (CEX, stablecoin-kibocsátó, stb.)
exclude_categories = ["CEX", "Chain", "RWA", "Bridge", "Staking Pool", "Liquid Staking"]
# Friss listázásnak számít, ha a DefiLlama ennyi napon belül vette fel
early_days = 60
# Minden futásnál legfeljebb ennyi CoinGecko részletlekérés (fejlesztői adat, tőzsdeszám)
coingecko_details_limit = 40
# Hány naponta frissüljön egy projekt CoinGecko-részlete / GitHub-statisztikája
details_refresh_days = 7
# GitHub lekérés legfeljebb ennyi projektre futásonként (token nélkül tartsd alacsonyan)
github_projects_limit = 30
# Legfeljebb ennyi repót nézünk egy szervezetnél
github_repos_per_project = 3
# DefiLlama TVL-történet lekérése (30 napos változáshoz) legfeljebb ennyi projektre
tvl_history_limit = 150
# Kézzel hozzáadott projektek (DefiLlama slug), akkor is bekerülnek, ha kicsik
always_include = []

[weights]
usage = 30
tokenomics = 20
team = 20
liquidity = 15
red_flags = 15

[scoring]
# Ha a piros-zászló pontszám ez alá esik, az összpontszám felülről korlátozva lesz
red_flag_floor = 30
red_flag_cap_total = 45
# Jelentős unlock: ennyi napon belül és a piaci kapitalizáció ekkora %-a felett
unlock_horizon_days = 30
unlock_pct_of_mcap = 5.0
# Fejlesztés "leállt": ennyi napja nincs push
dev_stalled_days = 90
# Gyanúsan magas hozam (APY %), legalább ekkora pool-TVL mellett
extreme_apy = 100.0
extreme_apy_min_pool_tvl = 100_000

[alerts]
tvl_drop_7d_pct = -25.0
tvl_drop_1d_pct = -15.0
unlock_days_ahead = 14
new_project_min_score = 60
score_jump_points = 15
max_alerts_per_run = 25

[dca]
# Az OKX DCA bot számára exportált jelöltek szűrője
min_score = 70
min_liquidity_score = 50
min_red_flag_score = 60
min_mcap_usd = 20_000_000
max_candidates = 15

# Kézi felülírások DefiLlama slug szerint. Példa:
# [overrides.uniswap]
# anonymous_team = false
# concentrated_ownership = false
# audited = true
# exclude = false
# notes = "Megjegyzés"
[overrides]

[web]
# A beépített ütemező a webszerverrel együtt indul és ekkor futtatja a napi kört (helyi idő)
scheduler = true
run_at = "06:00"
send_telegram = true

[snapshot]
# Governance-aktivitás a Snapshot hubról (nem kell kulcs). A space-t a DefiLlama governanceID
# mezőjéből vagy tippekből (slug.eth, slugdao.eth, ...) oldjuk fel; kézzel: [overrides.slug] snapshot_space = "x.eth"
enabled = true
projects_limit = 80
window_days = 90
min_interval = 1.0

[dune]
# Dune Analytics: mentett lekérdezések eredményeit kötjük a projektekhez. Kell a DUNE_API_KEY a .env-ben.
# Az eredmény lekérése olcsó; a futtatás (execute_if_stale) kreditet fogyaszt.
enabled = false
max_age_hours = 36
execute_if_stale = false

# Példa: egy lekérdezés, amelynek eredménye soronként egy protokoll ("protocol" oszlop = DefiLlama slug),
# és oszlopai: active_users_30d, revenue_usd_30d, tx_count_30d.
# A szabványos mutatónevek (users_24h, users_30d, revenue_30d, fees_30d, txs_30d, volume_30d, holders)
# beépülnek a pontozásba; bármilyen más név csak megjelenik a projekt oldalán.
# [[dune.queries]]
# id = 1234567
# match_by = "slug"               # slug | symbol | gecko_id | name
# match_column = "protocol"
# metrics = { users_30d = "active_users_30d", revenue_30d = "revenue_usd_30d", txs_30d = "tx_count_30d" }

[tokenterminal]
# Token Terminal API (fizetős csomagban elérhető API-kulcs, Bearer): TOKENTERMINAL_API_KEY a .env-ben.
# Szabványosított díj / bevétel / DAU-MAU / tranzakció / holder adatok; ahol a DefiLlama-nál hiányzik, ezek pótolják.
enabled = false
# bulk: metrikánként egy hívás az összes projektre (kevés hívás, nagy válasz)
# per_project: projektenként egy hívás, legfeljebb projects_limit projektre (TVL szerint)
mode = "bulk"
window_days = 30
projects_limit = 100
min_interval = 0.5
# Metrika-azonosítók felülírása, ha a Token Terminal másképp nevezi őket (a /v2/metrics lista alapján a futás figyelmeztet).
# Egy mutató kikapcsolása: fees = false
[tokenterminal.metrics]
# users_daily = "user_dau"
# Kézi projekt-illesztés: saját DefiLlama slug -> Token Terminal project_id
[tokenterminal.project_ids]
# "uniswap" = "uniswap"
